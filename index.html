<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Clearing — Invysible College</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6.5' fill='none' stroke='%231F2A33' stroke-width='1.5'/%3E%3Ccircle cx='8' cy='8' r='1.6' fill='%231F2A33'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f2eadb;
        --ink: #1f2a33;
        --written: #2b5468;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 1.25rem;
        line-height: 1.5;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px 64px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      h1 {
        font-family: 'Jost', sans-serif;
        font-weight: 500;
        font-size: 0.8rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        margin: 0;
      }
      #clearing {
        position: relative;
        width: min(640px, 100%);
        aspect-ratio: 1;
      }
      #clearing canvas { display: block; width: 100%; height: 100%; }
      .ripple {
        position: absolute;
        width: 0;
        height: 0;
        border: 3px solid;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        animation: ripple 1.4s ease-out forwards;
      }
      @keyframes ripple {
        from { width: 0; height: 0; opacity: 0.9; }
        to { width: 320px; height: 190px; opacity: 0; }
      }
      .orientation {
        margin: 0;
        text-align: center;
        max-width: 38em;
        font-size: 1.35rem;
      }
      .slot {
        font-family: 'Caveat', cursive;
        font-weight: 600;
        font-size: 1.55em;
        color: var(--written);
        white-space: nowrap;
      }
      .slot.open { color: rgba(31, 42, 51, 0.35); font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1em; font-weight: 400; }
      /* the hand overhangs its box, so the reveal's box is given room for it */
      .slot.writing {
        display: inline-block;
        padding: 0 0.2em 0 0.05em;
        animation: write 0.9s steps(18, end) both;
      }
      @keyframes write {
        from { clip-path: inset(0 100% 0 0); }
        to { clip-path: inset(0 0 0 0); }
      }
      .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
      button {
        font-family: 'Jost', sans-serif;
        font-size: 0.95rem;
        color: var(--ink);
        background: transparent;
        border: 1.5px solid var(--ink);
        border-radius: 999px;
        padding: 8px 20px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.4; cursor: default; }
      button:focus-visible { outline: 2px solid var(--written); outline-offset: 3px; }
      #throw { font-size: 1.05rem; font-weight: 500; padding: 10px 30px; background: var(--ink); color: var(--paper); }
      .small { font-size: 0.8rem; padding: 5px 12px; }
      .orientation .small { padding: 5px 8px; line-height: 0; vertical-align: middle; }
      #sound[aria-pressed='false'] { opacity: 0.6; }
      #porter {
        font-style: italic;
        text-align: center;
        max-width: 36em;
        margin: 0;
        min-height: 5em;
        opacity: 0;
      }
      #porter.shown { animation: arrive 1.2s ease-out 0.6s forwards; }
      #porter::before { content: 'The Head Porter'; display: block; font-style: normal; font-family: 'Jost', sans-serif; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 4px; }
      #porter:empty::before { content: none; }
      @keyframes arrive { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .slot.writing, #porter.shown { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>The Clearing</h1>
      <div id="clearing" aria-label="The Clearing, where the dice are thrown"></div>

      <p class="orientation">
        My stance towards the Clearing is that of a Reader in the Library of Thyngs, through
        <span class="slot open" id="slot-skhool">[Skhool]</span>
        <button class="small" id="throw-cube" aria-label="Throw the MetaMind cube only"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1.5" y="1.5" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="7" r="1.4" fill="currentColor"/></svg></button>,
        and I am
        <span class="slot open" id="slot-sub">[sub-stance]</span>
        <button class="small" id="throw-tetra" aria-label="Throw the sub-stance die only"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.8 L12.6 12 H1.4 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>,
        with Sam.
      </p>

      <div class="controls">
        <button id="throw">Throw</button>
        <button class="small" id="sound" aria-pressed="true">Sound on</button>
      </div>

      <p id="porter" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
